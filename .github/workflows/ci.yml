#
# Builds and tests without any game data (CLAUDE.md §7). Never add steps that
# download, cache or upload game files or anything generated from them.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (SPDX, clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: SPDX headers
        run: |
          python -I tools/check_spdx.py
          python -I tools/check_spdx_test.py
      - name: clang-format
        run: |
          python -m pip install --disable-pip-version-check clang-format==23.1.3
          git ls-files -z '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.inl' \
            | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        variant: [asan-ubsan, release]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
          - variant: asan-ubsan
            build_type: Debug
            sanitizers: address;undefined
          - variant: release
            build_type: Release
            sanitizers: ''
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          "-DMPO_SANITIZERS=${{ matrix.sanitizers }}"
          -DMPO_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows ${{ matrix.toolset }} ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolset: msvc
            config: Debug
            toolset_args: ''
          - toolset: msvc
            config: Release
            toolset_args: ''
          - toolset: clang-cl
            config: Release
            toolset_args: -T ClangCL
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Default generator: the newest Visual Studio on the runner (multi-config).
      - name: Configure
        run: cmake -S . -B build -A x64 ${{ matrix.toolset_args }} -DMPO_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

# PARAM.SFO's DISC_ID and DISC_VERSION match a [[version]] and every file not
# listed in `ignored` matches exactly: same set of files, sizes and SHA-256
# (EBOOT.BIN is hashed encrypted, as stored on the disc).
#
# Sizes and hashes are not copyrighted content and are versioned; the files are
# never committed. Regenerate the `file` list with:
#   mpo --manifest <iso> --ignore PSP_GAME/SYSDIR/UPDATE/ --ignore PSP_GAME/SYSDIR/BOOT.BIN
#
# `ignored`: the firmware updater (SYSDIR/UPDATE) and SYSDIR/BOOT.BIN are not
# used by the game and are commonly blanked in dumps, so they are not checked.
# `extract`: copied to <game-dir>/disc/ by `mpo --install` for analysis
# (F02-F04). "*.ext" matches by suffix.
# `decrypt`: ~PSP modules that `mpo --install` decrypts to <game-dir>/elf/
# (F02). `size` and `sha256` are those of the decrypted ELF, which must match
# PPSSPP's "Dump decrypted EBOOT.BIN" (its first `size` bytes; PPSSPP also
# writes the decryption buffer residue after the ELF).


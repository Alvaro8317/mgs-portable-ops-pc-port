# SPDX-License-Identifier: GPL-3.0-or-later
#
# The portable toolchain `setup.py toolchain` downloads on the player's machine
# (F22b, docs/analysis/distribution.md §3), so that nobody has to install a
# compiler, CMake or Ninja. Every archive is checked against its SHA-256 before
# it is unpacked; a mismatch stops the install.
#
# - One table per platform (`windows-x86_64`), one subtable per tool. `url` is
#   where to get it, `sha256` and `size` what it must be, `top` the folder the
#   archive unpacks to ("" when the files are at its root) and `bin` where the
#   programs are inside it.
# - The SHA-256 come from the GitHub release digests (llvm-mingw, CMake and
#   Ninja) and were checked against the downloads on 2026-11-01.
# - The stage libraries and mpo_boot must come from the same compiler (they
#   link to each other), and the FFmpeg the Windows release carries is built by
#   the CI with this same llvm-mingw: change the version in both places.
# - Linux uses the compilers of the system or of the Flatpak SDK (no table).

[windows-x86_64.llvm-mingw]
version = "20261020"
url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip"
sha256 = "fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd"
size = 190612575
top = "llvm-mingw-20261020-ucrt-x86_64"
bin = "bin"
license = "Apache-2.0 WITH LLVM-exception (LLVM), ZPL-2.1 and others (mingw-w64)"

[windows-x86_64.cmake]
version = "4.4.5"
url = "https://github.com/Kitware/CMake/releases/download/v4.4.5/cmake-4.4.5-windows-x86_64.zip"
sha256 = "326c826486d46a23cf9d5a1c9ee3a567d427bdd02c4a34071937a2a675cff004"
top = "cmake-4.4.5-windows-x86_64"
bin = "bin"
license = "BSD-3-Clause"

[windows-x86_64.ninja]
version = "1.13.2"
url = "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip"
sha256 = "07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65"
top = ""
bin = ""
license = "Apache-2.0"

# Not downloaded: the Windows release ZIP carries it next to the launcher
# (python/), since the launcher needs a Python to run this script at all.
# Listed so the release workflow and the tests pin the same file.
[windows-x86_64.python]
version = "3.14.10"
url = "https://www.python.org/ftp/python/3.14.10/python-3.14.10-embed-amd64.zip"
sha256 = "90905e64a840557d8c1bc4f5b74db3d7ee85e3ffb217611cac1c7813acea4159"
size = 12619664
top = ""
bin = ""
license = "PSF-2.0"
bundled = true

# Only for the release workflow (not setup.py): the same llvm-mingw, hosted on
# Linux, cross-compiles the FFmpeg that the Windows release carries
# (packaging/ffmpeg), so it matches what the player's machine compiles with.
[release-linux-x86_64.llvm-mingw]
version = "20261020"
url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz"
sha256 = "55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335"
size = 84017268
top = "llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64"
bin = "bin"
license = "Apache-2.0 WITH LLVM-exception (LLVM), ZPL-2.1 and others (mingw-w64)"

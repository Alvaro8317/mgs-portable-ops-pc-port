#
# Default input mapping (F10a; PC layout since F22). Copy it to the config
# folder as input.toml (~/.config/mpo-pc-port/ on Linux) and edit it, or pass
# it with --input-map.
#
# Each PSP input lists the host inputs that drive it, by SDL3 name:
# - [keyboard]: key names as SDL_GetScancodeFromName accepts them ("Z",
#   "Space", "Return", "Left Shift"...). Keys are physical positions, so the
#   map keeps its layout on AZERTY or QWERTZ keyboards.
# - [mouse]: mouse buttons, "left", "middle", "right", "x1" or "x2".
# - [gamepad]: SDL gamepad button names ("a" is the bottom face button: cross
#   on PlayStation, A on Xbox) and axis halves with a sign ("+lefttrigger",
#   "-leftx" is the stick pushed left, "+lefty" is down).
# PSP inputs: up down left right cross circle square triangle l r start select
# home, and analog_up/down/left/right for the stick.
#
# A section that is present replaces that device's defaults; a missing one
# keeps them. The keyboard and mouse use the PC layout chosen in F22: WASD for
# the stick and the arrows for the d-pad (the game's menus move with the
# d-pad). The gamepad keeps PPSSPP v1.20.4's defaultXInputKeyMap plus the
# triggers as L/R, and [analog] holds PPSSPP's stick settings (deadzone,
# inverse deadzone, sensitivity, square or circular stick, threshold for axes
# used as buttons).
# [mouse_camera] turns the game's camera (the d-pad) with the mouse: click in
# the window to capture the mouse, F1 (or switching windows) releases it. Every
# pixels_per_press pixels of motion press left or right for one frame, so a
# faster motion turns more often; vertical = true drives up/down too.
# mpo_frontend_sdl_test checks that this file equals InputMapping::Default().

[keyboard]
analog_up = ["W"]
analog_left = ["A"]
analog_down = ["S"]
analog_right = ["D"]
up = ["Up"]
down = ["Down"]
left = ["Left"]
right = ["Right"]
cross = ["Space"]
triangle = ["Left Ctrl", "Right Ctrl"]
l = ["Q"]
r = ["E"]
start = ["Escape", "Return"]
select = ["Tab"]

[mouse]
circle = ["right"]
square = ["left"]

[gamepad]
up = ["dpup"]
down = ["dpdown"]
left = ["dpleft"]
right = ["dpright"]
cross = ["a"]
circle = ["b"]
square = ["x"]
triangle = ["y"]
l = ["leftshoulder", "+lefttrigger"]
r = ["rightshoulder", "+righttrigger"]
start = ["start"]
select = ["back"]
analog_up = ["-lefty"]
analog_down = ["+lefty"]
analog_left = ["-leftx"]
analog_right = ["+leftx"]

[analog]
deadzone = 0.15
inverse_deadzone = 0.0
sensitivity = 1.1
circular = false
axis_button_threshold = 0.75

[mouse_camera]
enabled = true
pixels_per_press = 6.0
vertical = false
